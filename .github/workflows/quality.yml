name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      AUTH_ACCESS_SECRET: ci-auth-secret-change-me
      AI_SETTINGS_SECRET: ci-ai-settings-secret-change-me
      FRONTEND_ORIGIN: http://localhost:5173
      VITE_FRONTEND_URL: http://localhost:5173
      DATABASE_URL: mysql://root@localhost:3306/ai_factory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate generator security baseline
        working-directory: backend
        run: npm run test:security:baseline

      - name: Run security smoke test
        working-directory: backend
        run: npm run test:security:smoke

      - name: Run auth and governance smoke test
        working-directory: backend
        run: npm run test:auth-governance:smoke

      - name: Run authenticated user flow smoke test
        working-directory: backend
        run: npm run test:auth-user-flow:smoke

      - name: Run agent run recovery smoke test
        working-directory: backend
        run: npm run test:agent-run-recovery:smoke

      - name: Run project manager recovery smoke test
        working-directory: backend
        run: npm run test:project-manager-recovery:smoke

      - name: Run architect recovery smoke test
        working-directory: backend
        run: npm run test:architect-recovery:smoke

      - name: Run runtime observability smoke test
        working-directory: backend
        run: npm run test:runtime-observability:smoke

      - name: Run pipeline coherence smoke test
        working-directory: backend
        run: npm run test:pipeline-coherence:smoke

      - name: Run requirements recovery smoke test
        working-directory: backend
        run: npm run test:requirements-recovery:smoke

      - name: Run QA recovery smoke test
        working-directory: backend
        run: npm run test:qa-recovery:smoke

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Python scripts
        run: python -m py_compile orchestrator/backendGenerator.py orchestrator/projectBuilder.py
